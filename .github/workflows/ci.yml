name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run lint
      - run: npm run build
      # The browser version (npm start, Docker) on top of that build.
      - run: npm run build:server
      # Unit and server tests. The browser tests (testing/*.mjs and the five
      # dev-server UI tests that package.json leaves out) need Playwright and
      # a running app, so they are not run here.
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t appblips:ci .
