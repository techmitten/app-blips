name: Desktop

# Builds the Linux desktop installers (AppImage, .deb and snap) on
# Ubuntu 24.04. Run it by hand from the Actions tab, or push a tag like v0.1.0
# to also publish them as a draft GitHub Release (bump "version" in
# package.json to match first) and upload the snap to the Snap Store's
# stable channel, using the SNAPCRAFT_STORE_CREDENTIALS secret (made with
# `snapcraft export-login` with stable channel access). This publishes the snap
# to Ubuntu's App Center during the build (see notes/RELEASING.md). It isn't
# attached to the GitHub release: snaps are installed from the store. Publishing that draft is what rolls the update out: installed
# AppImage builds check the latest published release, using the latest*.yml
# file uploaded alongside. Windows is distributed only through the Microsoft
# Store, built by hand (see notes/RELEASING.md) — this workflow never builds it. It
# does attach build/windows/AppBlips-Windows-Installer.exe, the small installer
# Microsoft generates for the Store listing: it holds no app, just AppBlips'
# Store ID (stamped into its signature, so renaming it is safe), and installs
# whatever version the Store currently serves. It never needs replacing per
# release.

on:
  workflow_dispatch:
    inputs:
      store_only:
        description: Only build and submit the Microsoft Store package
        type: boolean
        default: false
      tag:
        description: With store_only, the release tag to build the Store package from (e.g. v0.1.35)
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.store_only }}
    # 24.04 explicitly: the core24 snap is built on it, and ubuntu-latest moves
    # to newer releases on its own.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder builds the snap with snapcraft inside an LXD container
      # (snapcraft.core24.useLXD in electron-builder.yml); snapcraft also
      # uploads it.
      - uses: canonical/setup-lxd@v0.1.3
      # snapcraft 8, not the default 9: electron-builder 26 writes the menu entry
      # to snap/gui/ for snapcraft to copy into the snap, and snapcraft 9 checks
      # for it before copying ("Failed to generate desktop file ... file does
      # not exist"). Try the default channel again after upgrading
      # electron-builder.
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - run: npm run desktop:dist
      - name: Add the Microsoft Store installer
        run: cp build/windows/AppBlips-Windows-Installer.exe dist-desktop/
      - name: Write SHA-256 checksums
        run: |
          cd dist-desktop
          : > SHA256SUMS.txt
          for f in *.AppImage *.deb *.exe; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/AppBlips-Windows-Installer.exe
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
            dist-desktop/SHA256SUMS.txt
      - name: Upload the snap to the Snap Store (stable)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload --release=stable dist-desktop/*.snap

  # Builds the Microsoft Store package on Windows and uploads it to Partner
  # Center as a DRAFT submission (--noCommit); you review it and click Submit
  # to the Store there. The .appx is never uploaded anywhere else (not to the GitHub
  # release). Runs for v* tags, or by hand with store_only (npm run release store). Needs these repository secrets, from
  # Partner Center → Account settings → Microsoft Entra ID (app with the
  # Manager role) and the app's Product identity: MSSTORE_TENANT_ID,
  # MSSTORE_SELLER_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET,
  # MSSTORE_PRODUCT_ID. Microsoft's certification takes days and only
  # starts when you submit the draft.
  store:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.store_only
    runs-on: windows-latest
    steps:
      # store_only runs come from master (so they use this workflow file) but
      # build the code of the tag given in `tag`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:store
      - uses: microsoft/setup-msstore-cli@v1
      - name: Submit to the Microsoft Store
        shell: bash
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          # -i must be the package file itself; given only a folder, msstore
          # looks for a project to build and fails. The Store accepts the
          # electron-builder .appx; msstore wants an .msix name, so copy it.
          appx="$(ls dist-desktop/AppBlips-Store-*.appx | head -1)"
          cp "$appx" dist-desktop/AppBlips-Store.msix
          msstore publish dist-desktop -i dist-desktop/AppBlips-Store.msix -id "$MSSTORE_PRODUCT_ID" --noCommit -v
