name: Desktop

# Builds the Linux desktop installers (AppImage + .deb) on ubuntu-latest. Run
# it by hand from the Actions tab, or push a tag like v0.1.0 to also publish
# them as a draft GitHub Release (bump "version" in package.json to match
# first). Publishing that draft is what rolls the update out: installed
# AppImage builds check the latest published release, using the latest*.yml
# file uploaded alongside. Windows is distributed only through the Microsoft
# Store, built by hand (see RELEASING.md) — this workflow never builds it. It
# does attach build/windows/AppBlips-Windows-Installer.exe, the small installer
# Microsoft generates for the Store listing: it holds no app, just AppBlips'
# Store ID (stamped into its signature, so renaming it is safe), and installs
# whatever version the Store currently serves. It never needs replacing per
# release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - name: Add the Microsoft Store installer
        run: cp build/windows/AppBlips-Windows-Installer.exe dist-desktop/
      - name: Write SHA-256 checksums
        run: |
          cd dist-desktop
          : > SHA256SUMS.txt
          for f in *.AppImage *.deb *.exe; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/AppBlips-Windows-Installer.exe
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
            dist-desktop/SHA256SUMS.txt
