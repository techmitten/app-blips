<svg xmlns="http://www.w3.org/2000/svg" width="300" height="92" viewBox="0 0 300 92" role="img" aria-label="Try it in your browser">
  <title>Try it in your browser</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.27"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clip"><rect x="10" y="8" width="280" height="68" rx="18"/></clipPath>
    <clipPath id="globe"><circle cx="46" cy="42" r="12.5"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 4.5s cubic-bezier(.22,1,.36,1) infinite; animation-delay: 1.2s; transform: translateX(-140px) skewX(-20deg); }
    .arrow { animation: nudge 1.8s ease-in-out infinite; animation-delay: 0.6s; }
    .meridians { animation: turn 6s linear infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-140px) skewX(-20deg); } 100% { transform: translateX(420px) skewX(-20deg); } }
    @keyframes nudge { 0%, 100% { transform: translate(-1.5px, 1.5px); } 50% { transform: translate(1.5px, -1.5px); } }
    @keyframes turn { from { transform: translateX(0); } to { transform: translateX(-25px); } }
    @media (prefers-reduced-motion: reduce) { .shine, .arrow, .meridians { animation: none; } }
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
  </style>

  <g filter="url(#glow)">
    <rect x="10" y="8" width="280" height="68" rx="18" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="10" y="8" width="280" height="68" fill="url(#gloss)"/>
    <circle cx="262" cy="-6" r="56" fill="#fff" opacity="0.07"/>
    <circle cx="300" cy="80" r="40" fill="#fff" opacity="0.06"/>
    <rect class="shine" x="0" y="0" width="70" height="92" fill="url(#shine)"/>
  </g>
  <rect x="10.5" y="8.5" width="279" height="67" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.28"/>

  <!-- A globe on a white tile, its meridians turning -->
  <rect x="22" y="18" width="48" height="48" rx="13" fill="#fff"/>
  <g fill="none" stroke="url(#logo)" stroke-width="2.4" stroke-linecap="round">
    <g clip-path="url(#globe)">
      <g class="meridians">
        <ellipse cx="46" cy="42" rx="5.5" ry="12.5"/>
        <ellipse cx="71" cy="42" rx="5.5" ry="12.5"/>
        <line x1="58.5" y1="29" x2="58.5" y2="55"/>
        <line x1="33.5" y1="29" x2="33.5" y2="55"/>
      </g>
      <path d="M33 37h26M33 47h26"/>
    </g>
    <circle cx="46" cy="42" r="12.5"/>
  </g>

  <text x="84" y="37" font-size="11" font-weight="600" letter-spacing="1.6" opacity="0.85">TRY IT IN YOUR</text>
  <text x="83" y="62" font-size="25" font-weight="700" letter-spacing="-0.3">Browser</text>

  <!-- open arrow -->
  <circle cx="258" cy="42" r="17" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.35"/>
  <g class="arrow" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252.5 47.5l11-11M255 36.5h8.5V45"/>
  </g>
</svg>
