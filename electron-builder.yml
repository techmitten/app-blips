# Desktop installers (npm run desktop:dist): Linux AppImage, .deb and snap,
# built by the CI workflow in .github/workflows/desktop.yml (which uploads the
# snap to the Snap Store, the source of Ubuntu's App Center). Windows is distributed
# only through the Microsoft Store (npm run desktop:store, built by hand on a
# Windows PC, see notes/RELEASING.md); the win: section below exists only to give
# that package an icon, not to build a Windows installer.
appId: com.appblips.desktop
productName: AppBlips
copyright: Copyright © 2026 TechMitten
directories:
  output: dist-desktop
  buildResources: build
# The renderer is pre-bundled in dist/ and the main process (with the server
# handlers and electron-updater) in dist-electron/ (scripts/build-electron.js),
# so no node_modules ship in the app.
files:
  - dist/**
  - dist-electron/**
  - electron/preload.cjs
  - build/icon.png
  - package.json
  - "!**/node_modules/**"
npmRebuild: false
nodeGypRebuild: false
win:
  icon: build/icon.png
# Microsoft Store package (npm run desktop:store, on a Windows PC). Never part
# of npm run release or CI: it's built locally and uploaded to Partner Center
# by hand, and the Store signs it, so it needs no certificate.
# The tile images are build/appx/*.png, made from build/icon.svg (as is
# build/icon.png) by scripts/appx-icons.sh (rerun it after changing the
# icon). The identity
# values come from Partner Center → the app → Product identity and must match
# it exactly, or the upload is rejected. The package is unsigned (the Store
# signs it), so Windows won't install the file directly; to test it, turn on
# Developer Mode, unzip it and run
# Add-AppxPackage -Register <folder>\AppxManifest.xml.
appx:
  identityName: TechMitten.AppBlips          # Package/Identity/Name
  publisher: CN=ADD5F838-06D7-4CA2-AAEB-75AF269F2969  # Package/Identity/Publisher
  publisherDisplayName: TechMitten           # Package/Properties/PublisherDisplayName
  applicationId: AppBlips
  displayName: AppBlips
  # The icon's own background color, so Windows doesn't frame it in the accent color.
  backgroundColor: "#0A0A0A"
  languages: [en-US]
  # Electron needs Windows 10 1809 (build 17763) or later; electron-builder's
  # default (14316) would offer it to Windows versions it can't run on.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  # Voice input records the microphone; without this Windows blocks it for
  # Store installs.
  capabilities: [microphone]
  artifactName: AppBlips-Store-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: snap
      arch: [x64]
  category: Development
  # Add a contact address ("Name <email>") before publishing .deb packages.
  maintainer: TechMitten
  syncDesktopName: true
  # One PNG per size (build/icons/NxN.png, made by scripts/appx-icons.sh). The
  # .deb installs each into /usr/share/icons/hicolor/NxN/apps/; given only the
  # 1024px icon it installs just a 1024x1024 one, a size the hicolor theme
  # doesn't have, so the launcher and taskbar fall back to a generic icon.
  icon: build/icons
  synopsis: Turn a text prompt into a working app, website or game.
  artifactName: AppBlips-${version}-${arch}.${ext}
# after-install.tpl is electron-builder's own after-install script
# (node_modules/app-builder-lib/templates/linux) plus a cleanup of the old
# GitHub Pages apt source, so re-copy it when upgrading electron-builder.
deb:
  afterInstall: build/linux/after-install.tpl
# Snap Store package, for Ubuntu's App Center. The Desktop workflow uploads it
# to the stable channel (see notes/RELEASING.md). snapd updates it;
# electron/updater.js checks the Snap Store for update notices.
# The name is package.json's "name" (appblips).
# core24 is built by snapcraft inside an LXD container (useLXD), with the gnome
# extension supplying the desktop libraries and the usual desktop plugs, so the
# build machine needs LXD (the workflow sets it up). Plugs:
#   default: electron-builder's standard set (desktop, home, x11, wayland,
#     network, opengl, audio-playback, ...)
#   browser-support: needed by Electron. Without allow-sandbox (which the
#     store reserves for browsers) the app runs with --no-sandbox in the snap,
#     which snap confinement replaces.
#   password-manager-service: the keyring, so the API key is properly encrypted
#   audio-record: the microphone, for voice input
#   removable-media: projects folders on USB drives (Choose folder)
# password-manager-service and audio-record aren't connected automatically
# until the Snap Store grants auto-connection; until then the user runs
# `snap connect appblips:<plug>`.
# The summary, description and icon are also the store listing's: after a
# change, push them with `snapcraft upload-metadata` (see notes/RELEASING.md).
snapcraft:
  base: core24
  core24:
    confinement: strict
    grade: stable
    useLXD: true
    # Run under X11 (XWayland on Wayland desktops) via --ozone-platform=x11.
    # Natively on Wayland, Electron in the snap renders with the snap's own
    # Mesa (mesa-2404) and the window flickers at random. The .deb and
    # AppImage use the host's graphics stack and aren't affected.
    forceX11: true
    plugs: [default, browser-support, password-manager-service, audio-record, removable-media]
    # Title, summary and description match the live store listing. Their words
    # are what Snap Store search matches (builder, maker, no-code, vibe coding,
    # App Blips), so keep those words when rewording. The title defaults to
    # productName ("AppBlips") if removed.
    title: "AppBlips: AI App, Website & Game Builder"
    summary: "AI builder: turn a text prompt into a working app, website or game."
    description: |
      AppBlips turns text or voice prompts into functional web apps, interactive websites, and games using artificial intelligence. Describe your idea in natural language, and the tool builds a complete, self-contained application for immediate testing in a secure local sandbox. Continue chatting with the assistant to iterate, debug, and refine your project dynamically. One-click publishing to your own custom domain for free. A no-code AI app maker, website builder and game generator for vibe coding. (Also known as App Blips.)

      Key Features:

      - Natural Language Generation: Create custom utilities, responsive web pages, and interactive prototypes from simple prompts.
      - Isolated Local Sandbox: Run and test generated code safely away from your personal system files.
      - Bring Your Own Key: Connect your preferred API keys from major AI providers, securely stored in your system keyring.
      - Built-in Voice Input: Speak your ideas directly using local speech recognition.
      - Single or Multi-File Output: Save projects cleanly as standalone files with zero complex dependencies.
      - One-Click Publishing: Easily share your completed creations to the web.
    artifactName: AppBlips-${version}-${arch}.${ext}
# Where electron-updater looks for new versions (Windows and AppImage builds
# update themselves; see electron/updater.js). Builds never upload by
# themselves (--publish never): the Desktop workflow attaches the installers
# and latest*.yml files to a draft release, which updates go out from once
# it is published.
publish:
  provider: github
  owner: TechMitten
  repo: app-blips
